syntax = "proto3";
package nesg.challenge.v1;

// One finished Challenge run. Carried base64url-encoded in the share URL (?run=...).
message ChallengeRun {
  string session_id = 1;            // UUID of this run
  string player_id = 2;             // UUID from localStorage nesg.playerId.v1
  string nickname = 3;
  string game = 4;                  // cross | jig | slide
  string difficulty = 5;            // easy | medium | hard
  uint32 seed = 6;                  // deterministic puzzle seed
  uint32 score = 7;                 // points
  uint32 time_ms = 8;               // elapsed play time
  string version = 9;               // game build, e.g. 0.6.0
  uint64 timestamp_ms = 10;         // unix epoch ms when finished
  string challenger_session_id = 11; // run this one answered (empty if none)
  string challenger_nickname = 12;
  uint32 challenger_score = 13;
  uint32 challenger_time_ms = 14;
}
