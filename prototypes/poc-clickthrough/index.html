<html lang="th"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1e2d"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">

<title>POC: คดี 01 อัลบั้มครอบครัวที่หายไป (click-through)</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;color:#eaf6ff}
#phone{position:relative;width:min(100vw,56.25vh);aspect-ratio:9/16;margin:0 auto;overflow:hidden;background:#2a2f3a}
#scene{position:absolute;inset:0;transition:opacity .3s}#scene.fade{opacity:0}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg.contain{object-fit:contain;background:#efe6d2}
svg.hl{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.hot polygon{fill:rgba(0,0,0,0);pointer-events:all;stroke:none;cursor:pointer}
.hot.hint .dot{fill:#ffe066;stroke:none;transform-box:fill-box;transform-origin:center;transform:scale(1.8)}
.hot .dot{fill:#bff6ff;stroke:none;pointer-events:none;transform-box:fill-box;transform-origin:center}
.hot.done .dot{fill:#9aa;stroke:#678;animation:none;opacity:.6}

.hot .lbl{opacity:0;pointer-events:none;transition:opacity .2s}
.hot.on .lbl{opacity:1}
.lbl rect{fill:rgba(6,30,48,.92);stroke:#39e0ff;stroke-width:2}.lbl text{fill:#eaf6ff;font-weight:600}

@keyframes nsfade{from{opacity:0}to{opacity:1}}
.nextstep{margin-top:4px;padding:4px 8px;background:#ffd23f;color:#1a1a1a;font-weight:bold;border-radius:8px;font-size:clamp(16px,3vh,21px);animation:nsfade .3s ease-out}

#evDot.on{display:block}
#caseBtn{position:absolute;right:12px;bottom:12px;padding:12px 14px;border-radius:12px;border:2px solid #39e0ff;background:rgba(6,30,48,.9);color:#fff;font-size:18px;cursor:pointer;z-index:6}
#dlg{position:absolute;left:4%;right:4%;bottom:96px;background:rgba(6,24,40,.95);border:2px solid #39e0ff;border-radius:12px;padding:12px 14px;font-size:clamp(17px,3vh,21px);line-height:1.5;display:none;z-index:7}
#dlg b{color:#7fe9ff}#dlg .btns{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
button.opt{background:#0d4a66;border:1px solid #39e0ff;color:#fff;border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
#board{position:absolute;left:4%;right:4%;top:10%;bottom:96px;background:rgba(6,24,40,.97);border:2px solid #39e0ff;border-radius:12px;padding:14px;display:none;z-index:8;overflow:auto}
#board li{margin:6px 0}#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:#0d4a66;border:1px solid #39e0ff;padding:6px 12px;border-radius:8px;display:none;z-index:9;font-size:18px}
.card{position:absolute;inset:0;background:linear-gradient(160deg,#f6e7d7,#e8d3f0);color:#3a3550}
.card h2{margin:0;padding:64px 16px 4px;text-align:center;font-size:20px}.card p{text-align:center;margin:4px 16px;font-size:17px;opacity:.8}
.slot{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;border:none}.slot i{display:block;width:16px;height:16px;border-radius:50%;background:rgba(191,246,255,.9);color:#0d4a66;font:bold 13px/16px sans-serif;text-align:center;font-style:normal}.slot .pill{position:absolute;bottom:60%;background:rgba(6,30,48,.92);color:#eaf6ff;border:2px solid #39e0ff;border-radius:14px;padding:3px 10px;font-size:17px;white-space:nowrap;opacity:0;transition:opacity .2s}.slot.on .pill{opacity:1}.slot.filled i{width:7px;height:7px;border-width:0;background:#bff6ff;animation:none;opacity:.7}.slot .item{font-size:22px;position:absolute}

.mapbtn{position:absolute;right:10px;top:62px;z-index:4;background:rgba(6,30,48,.85);border:1px solid #39e0ff;color:#fff;border-radius:16px;padding:5px 10px;font-size:17px;cursor:pointer}

.tag{position:absolute;right:8px;top:60px;background:#c0392b;color:#fff;font-size:15px;padding:2px 6px;border-radius:4px;z-index:5}

.mg{position:absolute;inset:0;padding:64px 12px 90px;display:flex;flex-direction:column;gap:10px;color:#13324a}
.mgbar{display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(6,30,48,.92);color:#eaf6ff;border:1px solid #39e0ff;border-radius:12px;padding:8px 10px;font-size:18px}
.mgbar .t{font-variant-numeric:tabular-nums}.mgbar .stars{font-size:19px;letter-spacing:1px}
.mgbtn{background:#0d4a66;border:1px solid #39e0ff;color:#fff;border-radius:10px;padding:8px 12px;font-size:18px;cursor:pointer}
.opt.locked{opacity:.45;filter:grayscale(1)}.prac{background:#ffcf4a;color:#3a2a00;border-radius:8px;padding:2px 6px;font-size:16px;font-weight:bold}
.pgrid{position:absolute;inset:0;overflow-y:auto;padding:66px 10px 90px}.chips{display:flex;gap:6px;margin-bottom:10px}.chip{border:1px solid #39e0ff;background:#0d2a3d;color:#cfefff;border-radius:16px;padding:5px 12px;font-size:17px}.chip.on{background:#39e0ff;color:#06212f;font-weight:bold}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gcard{position:relative;background:#fffaf0;border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer;color:#13324a}.gcard .gic{font-size:36px}.gcard.off{background:#2b3640;color:#8996a2;filter:grayscale(1)}.gcard .new{position:absolute;top:6px;right:6px;background:#ff5d73;color:#fff;font-style:normal;font-size:15px;border-radius:8px;padding:1px 6px}
.lvwrap{position:absolute;inset:0;overflow-y:auto;padding-top:60px}.lvpath{position:absolute;left:0;top:0;width:100%}.lvn{position:absolute;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);font-size:20px}.lvn span{position:absolute;top:60px;font-size:17px;white-space:nowrap}.lvn.done{background:#ffcf4a;border:3px solid #fff}.lvn.open{background:#39e0ff;border:3px solid #fff}.lvn.lock{background:#9aa4ad;opacity:.75}.lvtitle{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border-radius:12px;padding:4px 10px;font-weight:bold}
.mgdone{position:absolute;right:12px;bottom:84px;z-index:6}
.cw{background:#f4efe2 repeating-linear-gradient(0deg,transparent 0 22px,rgba(0,0,0,.03) 22px 23px);border-radius:10px;padding:12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cwg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:300px;margin:0 auto}

.sb{background:#2d55a6;border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.45);position:relative;width:min(100%,320px);margin:0 auto}
.sbg{position:relative;background:#c9a676;border-radius:8px;aspect-ratio:1;box-shadow:inset 0 0 0 4px #a07c4c}
.sbcell{position:absolute;border:1px dashed rgba(0,0,0,.15)}
.blk2{position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;cursor:pointer;transition:left .25s,top .25s;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.exit{position:absolute;right:-16px;width:16px;background:#1b2f5a;border-radius:0 6px 6px 0}
.keyhole{position:absolute;right:-46px;font-size:26px}

.dq{background:rgba(6,24,40,.93);border:1px solid #39e0ff;border-radius:12px;padding:8px 10px;color:#eaf6ff;font-size:17px}
.dq h4{margin:0 0 6px;font-size:18px}.dq.ok{border-color:#5fd38a}.dq.bad{border-color:#ff8a7a}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ch{border:2px solid #2d6d8a;background:#0d3346;color:#fff;border-radius:10px;padding:5px 8px;cursor:pointer;font-size:17px}
.ch.sel{border-color:#7fe9ff;background:#14607f;box-shadow:0 0 8px #39e0ff}
.por{width:58px;height:58px;margin-bottom:16px;border-radius:50%;background-size:cover;background-position:50% 18%;border:3px solid #2d6d8a;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
.por.sel{border-color:#7fe9ff;box-shadow:0 0 10px #39e0ff}.por span{white-space:nowrap;background:rgba(0,0,0,.6);font-size:15px;border-radius:6px;padding:0 4px;margin-bottom:-14px}
.evc{border:1px dashed #9adfff;border-radius:8px;padding:3px 7px;font-size:16px;cursor:pointer;background:#f6f0dd;color:#3a3020}
.evc.sel{border:2px solid #39e0ff;background:#dff8ff}
.mini{position:relative;width:96px;aspect-ratio:3/4;background:url(img/house-map.jpg) center/contain no-repeat #efe6d2;border-radius:6px}
.mini div{position:absolute;cursor:pointer;border-radius:4px}.mini div.sel{background:rgba(57,224,255,.35);outline:2px solid #39e0ff}
.hintbtn{position:absolute;left:10px;top:62px;z-index:4;width:44px;height:44px;border-radius:50%;border:2px solid #ffd84d;background:rgba(6,30,48,.88);font-size:22px;cursor:pointer;box-shadow:0 0 10px rgba(255,216,77,.6)}
.tutfx{outline:4px solid #ffd84d;outline-offset:3px}
.evlist{position:absolute;inset:0;overflow-y:auto;padding:70px 12px 96px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(170deg,#2a2440,#3a2f2a)}
.evh{color:#ffe6b8;font-size:17px;opacity:.85;text-align:center}
.evcard{position:relative;border-radius:16px;overflow:hidden;min-height:150px;background:#1a1a22;box-shadow:0 4px 0 rgba(0,0,0,.35);cursor:pointer;flex:none}
.evcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.evcard .evt{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff}
.evcard .evt b{font-size:18px;display:block}.evcard .evt small{font-size:17px;opacity:.9}
.evcard .badge{position:absolute;top:8px;left:8px;background:#ffcf4a;color:#3a2a00;font-size:16px;font-weight:bold;border-radius:8px;padding:2px 8px}
.evcard.off{cursor:default}.evcard.off img{filter:grayscale(1) brightness(.12)}.evcard.off .evt{color:#9aa4ad}.evcard.off .lock{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font-size:34px;opacity:.7}
.cs{position:absolute;inset:0;background:#000}.cs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bub{position:absolute;max-width:62%;background:#fff;color:#2b2233;border-radius:16px;padding:7px 11px;font-size:clamp(16px,2.7vh,19px);line-height:1.4;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.bub b{display:block;font-size:15px;color:#b0567a}
.cap{position:absolute;left:4%;right:4%;bottom:96px;background:#fff6dc;color:#3a2a10;border-radius:10px;padding:8px 12px;font-size:clamp(17px,2.8vh,20px);line-height:1.45;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.dots{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:8px;pointer-events:none}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4)}.dots i.on{background:#fff}
.skip{position:absolute;right:12px;bottom:16px;z-index:6;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:16px;padding:8px 14px;font-size:18px;cursor:pointer}
.tapnext{position:absolute;right:12px;bottom:58px;color:#fff;font-size:16px;opacity:.8;pointer-events:none}
#cal{position:absolute;inset:0;z-index:6;display:none;background:rgba(0,0,0,.55);padding:64px 14px 90px;overflow:auto}
.calc{border-radius:14px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.5)}.calh{display:flex;align-items:center;justify-content:space-between;border-radius:10px;padding:8px 10px;color:#fff;font-weight:bold;font-size:20px}.calh small{font-weight:normal;font-size:16px;opacity:.9}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0;text-align:center;font-size:17px}.calg .dw{font-weight:bold;opacity:.7;font-size:15px}.calg .d{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.55);line-height:1.1}.calg .d.m{font-weight:bold}.calg .d.t{box-shadow:inset 0 0 0 2px currentColor}.calg .d i{font-style:normal;font-size:16px}
.cale{font-size:17px;line-height:1.5;margin:0;padding-left:0;list-style:none}.cale li{padding:5px 6px;border-radius:8px;margin:3px 0;background:rgba(255,255,255,.5);cursor:pointer}.cale li.clue{background:rgba(255,220,200,.75)}
.calt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.calt button{border-radius:14px;border:1px solid #888;padding:4px 10px;font-size:16px;background:#fff;cursor:pointer}.calt button.on{background:#333;color:#fff}.calt button.lk{opacity:.5}
.calx{position:absolute;right:20px;top:70px;width:34px;height:34px;border-radius:50%;border:none;background:#fff;font-size:18px;cursor:pointer}
</style></head><body>
<div id="phone">
 <div id="scene"></div>
 <div id="hud"></div>
 <div id="dlg"></div><div id="cal"></div><div id="board"></div><div id="toast"></div>
 <button id="back" title="ย้อนกลับ" aria-label="ย้อนกลับ">←</button>
 <button id="caseBtn">📋 สมุดคดี<span id="evDot"></span></button>
</div>
<script>
const S={screen:'room',hist:[],ev:{},solved:false,reward:false,slots:{},played:{},practice:false,lv:{cross:[],jig:[],slide:[]},lvGame:'cross',lvN:1};
const LVN=14,LVT={cross:{n:'ครอสเวิร์ด',bg:'repeating-linear-gradient(0deg,#f7f3e6 0 27px,#b9d3e8 27px 28px)',path:'#2b4a6b',ic:'📰'},jig:{n:'จิ๊กซอว์',bg:'radial-gradient(circle at 30% 20%,#f3e7c9,#d9c39a)',path:'#7a5a2e',ic:'🗺'},slide:{n:'เลื่อนบล็อก',bg:'repeating-linear-gradient(90deg,#a8743f 0 46px,#9a6836 46px 92px)',path:'#3b2412',ic:'🧩'}};
function nstar(t){return (t.match(/⭐/g)||[]).length}
const PRAC=[['cross','ครอสเวิร์ด (ภาษา)'],['jig','จิ๊กซอว์ (มิติสัมพันธ์)'],['slide','เลื่อนบล็อก (ตรรกะ)']];
function practiceMenu(){go('prac')}
const EV={E01:'ข้อความของน้าริน: "ขอย้ายเก็บก่อน — ริน / เก็บตามผังเดิมนะ โต๊ะยังเปียกอยู่"',E02:'โต๊ะที่เปียก (น้ำจากแจกันหก)',E03:'ลุงเมฆ: กล่องมีรูปดาว',E04:'แผนผังบ้าน: ภาพถ่ายเก็บใต้หน้าต่างห้องทำงาน',E05:'พบอัลบั้มในกล่องรูปดาว'};
const LINES={open:'หลานมาแล้วเหรอจ๊ะ ยายหาอัลบั้มรูปครอบครัวไม่เจอ ในนั้นมีรูปตาตอนหนุ่ม ๆ ด้วยนะ',ask:'เมื่อเช้ายายยังเห็นวางอยู่บนโต๊ะกลางเลย แต่บ่ายนี้น้ารินเข้ามาเก็บกวาดนะ',stuck:'รูปเก่า ๆ บ้านนี้เขาเก็บไว้ที่เดียวกันมาตลอดแหละ ลองต่อแผนที่ที่หล่นกระจายอยู่ดูสิ',win:'นี่ไงรูปตา ขอบใจนะหลาน มานั่งดูด้วยกันมา ยายจะเล่าให้ฟัง'};
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1600)}
function readyDed(){return !S.deduced&&!!(S.ev.E01&&S.ev.E02&&S.ev.E04)}
function addEv(k){if(!S.ev[k]){S.ev[k]=1;$('evDot').classList.add('on');const t=TIMESLOTS.find(x=>x.unlockBy===k);toast('ได้หลักฐาน '+k+(t?' · ปลดล็อกเวลา: '+t.label:''))}}
function hs(pts,label,fn,done){return {pts,label,fn,done}}
function say(who,text,opts){const d=$('dlg');d.innerHTML='<b>'+who+':</b> “'+text+'”<div class="btns"></div>';const b=d.querySelector('.btns');(opts||[['ปิด',()=>d.style.display='none']]).forEach(([t,f])=>{const x=document.createElement('button');x.className='opt';x.textContent=t;x.onclick=f;b.appendChild(x)});d.style.display='block'}
const SLOTS=[['ผนัง',60,37,22,7],['ชั้นของที่ระลึก',58,25,25,9],['ขอบหน้าต่าง',2,41,18,7],['โต๊ะ',54,45,32,6],['เตียง',4,52,44,14],['พรมซ้าย',10,72,26,14],['พรมกลาง',38,74,26,14],['พรมขวา',66,76,28,14]];
function say2(who,lines,i){i=i||0;say(who,lines[i],i<lines.length-1?[['ต่อ',()=>say2(who,lines,i+1)]]:null)}
const SC={
 room:{title:'ห้องของฉัน (hub)',hud:()=>S.reward?'กลับถึงบ้านแล้ว — แตะช่องเพื่อวางของรางวัล':'ภารกิจ: ออกจากห้องไปเลือกเหตุการณ์',img:'player-room-wide.jpg',

 DQA.forEach((d,i)=>{const b=document.createElement('div');b.className='dq'+(DQ.ok[i]===1?' ok':DQ.ok[i]===-1?' bad':'');
  let h=`<h4>${d.q} ${DQ.ok[i]===1?'✅':''}</h4><div class="row">`;
  if(i===0)[['grandma','ยายมะลิ','img/living-grandma.jpg'],['mek','ลุงเมฆ','img/uncle-mek.jpg'],['rin','น้าริน','img/rin.jpg']].forEach(([k,n,im])=>h+=`<div class="por ${DQ.a[0]===k?'sel':''}" data-a="${k}" style="${im?`background-image:url(${im})`:'background:#c58fb0;font-size:28px'}">${im?'':'👩'}<span>${n}</span></div>`);
  if(i===1)[['water','น้ำหกบนโต๊ะ'],['hide','แอบซ่อนไว้'],['look','หยิบไปดูรูป']].forEach(([k,n])=>h+=`<button class="ch ${DQ.a[1]===k?'sel':''}" data-a="${k}">${n}</button>`);
  if(i===2){h+='<div class="mini">'+[['living',10,10,80,35],['study',12,46,40,34],['kitchen',53,46,35,34]].map(([k,x,y,ww,hh])=>`<div class="${DQ.a[2]===k?'sel':''}" data-a="${k}" title="${k}" style="left:${x}%;top:${y}%;width:${ww}%;height:${hh}%"></div>`).join('')+`</div><span>${{living:'ห้องนั่งเล่น',study:'ห้องทำงาน (ใต้หน้าต่าง)',kitchen:'ครัว'}[DQ.a[2]]||'แตะห้องบนแผนผัง'}</span>`}
  h+='</div><div class="row" style="margin-top:6px">หลักฐาน: '+evs.map(k=>`<span class="evc ${DQ.e[i]===k?'sel':''}" data-e="${k}">${k}</span>`).join('')+'</div>';
  b.innerHTML=h;b.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{DQ.a[i]=x.dataset.a;DQ.ok[i]=0;go('deduce',true)});
  b.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>{DQ.e[i]=x.dataset.e;DQ.ok[i]=0;go('deduce',true)});w.appendChild(b)});
 w.insertAdjacentHTML('beforeend','<div style="font-size:15px;color:#bfe9ff">'+evs.map(k=>k+': '+EV[k]).join('<br>')+'</div>');
 doneBtn(w,'⚖ ยืนยันข้อสรุป',()=>{let hint=null;DQA.forEach((d,i)=>{const okA=DQ.a[i]===d.right,okE=d.ev.includes(DQ.e[i]);DQ.ok[i]=okA&&okE?1:-1;if(!hint&&!(okA&&okE))hint=!okA?d.hint:EVHINT});
  go('deduce',true);setTimeout(()=>{if(hint)say('ยายมะลิ',hint);else{S.deduced=true;say('ยายมะลิ','เก่งมากหลาน! งั้นไปดูที่ห้องทำงานกันเถอะ',[['ไปห้องทำงาน',()=>{S.hist=['living'];go('study',true)}]])}},350)});return []}};

const GOALS=[
 {c:()=>!S.ev.E01||!S.ev.E02,room:'ห้องนั่งเล่น',at:'living',obj:'โต๊ะกลาง',sub:()=>({table:!S.ev.E01?'ข้อความของน้าริน':'รอยน้ำ'})},
 {c:()=>!S.ev.E04,room:'ห้องนั่งเล่น',at:'living',obj:'ถาดชิ้นแผนผัง',sub:{tray:'ต่อจิ๊กซอว์แผนผังบ้าน'}},
 {c:()=>!S.ev.E03,room:'ห้องนั่งเล่น',at:'living',obj:'ลุงเมฆ'},
 {c:()=>!S.deduced,room:'สมุดคดี',at:null,obj:'ปุ่ม 📋 สมุดคดี → สรุปคดี'},
 {c:()=>!S.solved,room:'ห้องทำงาน',at:'study',obj:'กล่องรูปดาว (ใต้หน้าต่าง)',sub:{box:'เล่นเลื่อนบล็อก'}},
 {c:()=>true,room:'บ้านของฉัน',at:'room',obj:'ช่องวางของ'}];
const HINT={goal:-1,tier:0};
function arHint(){const gi=GOALS.findIndex(g=>g.c());const g=GOALS[gi];if(HINT.goal!==gi){HINT.goal=gi;HINT.tier=0}
 HINT.tier=Math.min(HINT.tier+1,2);S.hintsUsed=(S.hintsUsed||0)+1;
 if(HINT.tier===1){toast('💡 คำใบ้ 1: ลองไปดูที่ '+g.room);return}
 const sb=typeof g.sub==='function'?g.sub():g.sub;let label=sb&&sb[S.screen]||(S.screen===g.at?g.obj:null);
 const el=label&&[...document.querySelectorAll('.hot')].find(h=>h.textContent.includes(label));
 if(el){el.classList.add('hint');setTimeout(()=>el.classList.remove('hint'),2500);toast('💡 คำใบ้ 2 (ฟรี): แตะ “'+label+'”')}
 else toast('💡 คำใบ้ 2 (ฟรี): ไปที่ '+g.room+' แล้วแตะ “'+g.obj+'”');draw2()}
function draw2(){const h=$('hud');const c=$('hc');if(c)c.textContent=MG.hints||0;else if(h&&SC[S.screen].render&&!['deduce','prac','lvmap','events','cutscene'].includes(S.screen))h.innerHTML+=' · คำใบ้ในมินิเกมนี้ <span id="hc">'+(MG.hints||0)+'</span> (มีผลต่อดาว)';else if(h&&!['prac','lvmap','events','cutscene'].includes(S.screen)&&!h.innerHTML.includes('สำรวจใช้ฟรี'))h.innerHTML+=' · 💡 คำใบ้สำรวจใช้ฟรี'}
function pickDiff(){say('เลือกระดับความยากของคดีนี้','เลือกได้ใหม่ทุกครั้งที่เริ่มคดี ไม่มีจำกัดเวลา',['ง่าย','ปานกลาง','ยาก'].map(d=>[d,()=>{DIFF=d;toast('ระดับ: '+d);if(S.screen==='cutscene'){S.hist=['room'];S.screen='events';S.csEnd=0}go('map')}]))}
const TUT=['ขั้น 1/3: แตะจุดเล็ก ๆ เพื่อดูหรือใช้วัตถุ','ขั้น 2/3: ปุ่ม ← มุมล่างซ้าย ใช้ย้อนกลับเสมอ','ขั้น 3/3: ปุ่ม 📋 สมุดคดี เปิดกระดานคดีและหลักฐาน'];
function tutorial(i){document.querySelectorAll('.tutfx').forEach(e=>e.classList.remove('tutfx'));if(i>=TUT.length){$('dlg').style.display='none';S.tut=1;return}
 const t=[null,'back','caseBtn'][i];if(t){$(t).classList.add('tutfx');$(t).style.visibility='visible'}say('บทสอน (HUD)',TUT[i],[[i<2?'ต่อ':'เริ่มเล่น',()=>tutorial(i+1)]])}
const HOUSE=['living','study','kitchen','table','tray','mek','grandma','kclose'];
function draw(){const sc=SC[S.screen],el=$('scene');let list;
 if(sc.render){el.innerHTML='<div class="bg" style="background:linear-gradient(160deg,#1d3346,#2c4a5e)"></div>';list=sc.render(el)}else{el.innerHTML=`<img class="bg ${sc.contain?'contain':''}" src="img/${typeof sc.img==='function'?sc.img():sc.img}" alt="">`;list=sc.hs();sc.extra&&sc.extra(el)}
 if(HOUSE.includes(S.screen)){const m=document.createElement('button');m.className='mapbtn';m.textContent='🗺 แผนผังบ้าน';m.onclick=()=>go('map');el.appendChild(m)}
 const map=!!sc.contain,W=map?sc.mw:720,Hh=map?sc.mh:1280,NS='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','hl');svg.setAttribute('viewBox',`0 0 ${W} ${Hh}`);svg.setAttribute('preserveAspectRatio',map?'xMidYMid meet':'xMidYMid slice');
 const fs=map?46:42;
 list.forEach(h=>{const P=h.pts.map(([x,y])=>map?[x,y]:[x*7.2,y*12.8]);
  const cx=P.reduce((a,p)=>a+p[0],0)/P.length,cy=P.reduce((a,p)=>a+p[1],0)/P.length,top=Math.min(...P.map(p=>p[1]));
  const g=document.createElementNS(NS,'g');g.setAttribute('class','hot'+(h.done?' done':''));
  const tw=h.label.length*fs*0.56+28;let lx=Math.max(4,Math.min(W-tw-4,cx-tw/2));let ly=cy-fs-56;if(ly<150)ly=cy+24;
  g.innerHTML=`<polygon points="${P.map(p=>p.join(',')).join(' ')}"/><circle class="dot" cx="${cx}" cy="${cy}" r="${map?11:13}"/><g class="lbl"><rect x="${lx}" y="${ly}" width="${tw}" height="${fs+20}" rx="${(fs+20)/2}"/><text x="${lx+tw/2}" y="${ly+fs+2}" font-size="${fs}" text-anchor="middle">${h.label}</text></g>`;
  g.querySelector('polygon').addEventListener('click',e=>{e.stopPropagation();g.classList.add('on');setTimeout(()=>{g.classList.remove('on');h.fn()},450)});
  svg.appendChild(g)});
 el.appendChild(svg);
 $('hud').innerHTML='<b>'+sc.title+'</b><br>'+sc.hud()+(['events','cutscene'].includes(S.screen)?'':' · หลักฐาน '+Object.keys(S.ev).length+'/5');
 $('back').style.visibility=S.hist.length?'visible':'hidden';$('caseBtn').style.display=['events','cutscene'].includes(S.screen)?'none':'';
 if(!sc.render){const hb=document.createElement('button');hb.className='hintbtn';hb.title='คำใบ้';hb.textContent='💡';hb.onclick=arHint;el.appendChild(hb)}draw2()}
function go(n,replace){$('dlg').style.display='none';$('cal').style.display='none';$('board').style.display='none';if(!replace&&n!==S.screen)S.hist.push(S.screen);if(['cross','jig','slide'].includes(n)&&!S.practice&&!S.played[n]){S.played[n]=1;S.lv[n][0]=2}
 if(n!=='living')S.slot='now';const el=$('scene');el.classList.add('fade');setTimeout(()=>{S.screen=n;draw();el.classList.remove('fade');SC[n].enter&&SC[n].enter()},300)}
$('back').onclick=()=>{if($('cal').style.display==='block'){$('cal').style.display='none';return}if($('dlg').style.display==='block'||$('board').style.display==='block'){$('dlg').style.display='none';$('board').style.display='none';return}const p=S.hist.pop();if(p==='room'||p==='lvmap')endPractice();if(p){const el=$('scene');el.classList.add('fade');setTimeout(()=>{S.screen=p;draw();el.classList.remove('fade')},300)}};
$('caseBtn').onclick=()=>{const b=$('board');$('evDot').classList.remove('on');if(b.style.display==='block'){b.style.display='none';return}
 b.innerHTML='<h3 style="margin-top:0">📋 กระดานคดี: อัลบั้มครอบครัวที่หายไป</h3><ul>'+Object.keys(EV).map(k=>S.ev[k]?`<li>✅ <b>${k}</b> ${EV[k]}</li>`:(k==='E05'&&!S.deduced?`<li style="opacity:.7">🔒 ${k} — ได้หลังสรุปคดี</li>`:`<li style="opacity:.45">⬜ ${k} — ยังไม่พบ</li>`)).join('')+'</ul>'+(S.deduced?'<p>✅ สรุปคดีแล้ว — ไปเปิดกล่องในห้องทำงาน</p>':S.ev.E01&&S.ev.E02&&S.ev.E04?(readyDed()?'<div class="nextstep big">✅ หลักฐานพอแล้ว! กดสรุปคดีได้เลย</div>':'')+'<button class="mgbtn" id="goDed">⚖ สรุปคดี (3 คำถาม)</button>':'<p style="opacity:.7">เก็บหลักฐาน E01, E02, E04 ให้ครบเพื่อสรุปคดี</p>');b.style.display='block';const g=$('goDed');if(g)g.onclick=()=>go('deduce')};
draw();setTimeout(()=>tutorial(0),400);
