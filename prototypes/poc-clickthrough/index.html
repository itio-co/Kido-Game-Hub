<html lang="th"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;color:#eaf6ff}
#phone{position:relative;width:min(100vw,56.25vh);aspect-ratio:9/16;margin:0 auto;overflow:hidden;background:#2a2f3a}
#scene{position:absolute;inset:0;transition:opacity .3s}#scene.fade{opacity:0}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg.contain{object-fit:contain;background:#efe6d2}
svg.hl{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.hot polygon{fill:rgba(0,0,0,0);pointer-events:all;stroke:transparent;stroke-width:4;stroke-linejoin:round;cursor:pointer;transition:stroke .2s,fill .2s,filter .2s}
.hot:hover polygon,.hot.on polygon{stroke:#8ff0ff;fill:rgba(120,235,255,.10);filter:drop-shadow(0 0 6px #39e0ff) drop-shadow(0 0 14px rgba(57,224,255,.7))}
.hot .dot{fill:#bff6ff;stroke:#39e0ff;stroke-width:3;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
.hot.done .dot{fill:#9aa;stroke:#678;animation:none;opacity:.6}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.6);opacity:.35}}
.hot .lbl{opacity:0;pointer-events:none;transition:opacity .2s}
.hot:hover .lbl,.hot.on .lbl{opacity:1}
.lbl rect{fill:rgba(6,30,48,.92);stroke:#39e0ff;stroke-width:2}.lbl text{fill:#eaf6ff;font-weight:600}
.hot:hover .dot,.hot.on .dot{opacity:0}
#hud{position:absolute;left:0;right:0;top:0;padding:8px 10px;background:rgba(6,20,32,.94);border-bottom:1px solid #39e0ff;font-size:clamp(11px,2.3vh,14px);pointer-events:none;z-index:5}
#back{position:absolute;left:12px;bottom:12px;width:64px;height:64px;border-radius:50%;border:3px solid #39e0ff;background:rgba(6,30,48,.9);color:#fff;font-size:30px;cursor:pointer;z-index:6}
#caseBtn{position:absolute;right:12px;bottom:12px;padding:12px 14px;border-radius:12px;border:2px solid #39e0ff;background:rgba(6,30,48,.9);color:#fff;font-size:15px;cursor:pointer;z-index:6}
#dlg{position:absolute;left:4%;right:4%;bottom:96px;background:rgba(6,24,40,.95);border:2px solid #39e0ff;border-radius:12px;padding:12px 14px;font-size:clamp(13px,2.5vh,16px);line-height:1.5;display:none;z-index:7}
#dlg b{color:#7fe9ff}#dlg .btns{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
button.opt{background:#0d4a66;border:1px solid #39e0ff;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
#board{position:absolute;left:4%;right:4%;top:10%;bottom:96px;background:rgba(6,24,40,.97);border:2px solid #39e0ff;border-radius:12px;padding:14px;display:none;z-index:8;overflow:auto}
#board li{margin:6px 0}#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:#0d4a66;border:1px solid #39e0ff;padding:6px 12px;border-radius:8px;display:none;z-index:9;font-size:14px}
.card{position:absolute;inset:0;background:linear-gradient(160deg,#f6e7d7,#e8d3f0);color:#3a3550}
.card h2{margin:0;padding:64px 16px 4px;text-align:center;font-size:20px}.card p{text-align:center;margin:4px 16px;font-size:13px;opacity:.8}
.slot{position:absolute;z-index:3;border:2px dashed rgba(57,224,255,.8);border-radius:10px;background:rgba(255,255,255,.25);color:#13324a;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;cursor:pointer;padding:2px}
.slot.filled{border-style:solid;background:#fff6c9;font-size:13px}
.mapbtn{position:absolute;right:10px;top:62px;z-index:4;background:rgba(6,30,48,.85);border:1px solid #39e0ff;color:#fff;border-radius:16px;padding:5px 10px;font-size:13px;cursor:pointer}
.slot.board{border-color:#8a6;background:rgba(255,255,255,.75)}
.tag{position:absolute;right:8px;top:60px;background:#c0392b;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;z-index:5}

.mg{position:absolute;inset:0;padding:64px 12px 90px;display:flex;flex-direction:column;gap:10px;color:#13324a}
.mgbar{display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(6,30,48,.92);color:#eaf6ff;border:1px solid #39e0ff;border-radius:12px;padding:8px 10px;font-size:14px}
.mgbar .t{font-variant-numeric:tabular-nums}.mgbar .stars{font-size:16px;letter-spacing:1px}
.mgbtn{background:#0d4a66;border:1px solid #39e0ff;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.opt.locked{opacity:.45;filter:grayscale(1)}.prac{background:#ffcf4a;color:#3a2a00;border-radius:8px;padding:2px 6px;font-size:12px;font-weight:bold}
.mgdone{position:absolute;right:12px;bottom:84px;z-index:6}
.cw{background:#f4efe2 repeating-linear-gradient(0deg,transparent 0 22px,rgba(0,0,0,.03) 22px 23px);border-radius:10px;padding:12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cwg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:300px;margin:0 auto}
.cwc{aspect-ratio:1;border:2px solid #333;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;position:relative;cursor:pointer}
.cwc.blk{background:#2b2b2b;border-color:#2b2b2b;cursor:default}.cwc.sel{background:#c9f3ff;outline:3px solid #39e0ff}.cwc.hl{background:#eafaff}
.cwc i{position:absolute;left:3px;top:1px;font-size:11px;font-style:normal;font-weight:600}
.clues{font-size:13px;line-height:1.55;margin-top:8px}.clues b{color:#0d4a66}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.keys button{width:46px;height:46px;font-size:22px;border-radius:10px;border:2px solid #39a8d8;background:#fff;cursor:pointer}
.jg{background:#6b4a2f;border-radius:12px;padding:10px;box-shadow:inset 0 0 0 4px #4d3420}
.jgb{position:relative;margin:0 auto;width:min(100%,300px);aspect-ratio:3/4;background:#efe6d2;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:2px}
.jgs{border:1px dashed rgba(0,0,0,.25)}
.pc{background-image:url(img/house-map.jpg);background-size:300% 400%;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer}
.jgt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#8a8f96;border-radius:12px;padding:10px}
.jgt .pc{width:62px;height:62px}.jgt .pc.sel{outline:3px solid #39e0ff}
.sb{background:#2d55a6;border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.45);position:relative;width:min(100%,320px);margin:0 auto}
.sbg{position:relative;background:#c9a676;border-radius:8px;aspect-ratio:1;box-shadow:inset 0 0 0 4px #a07c4c}
.sbcell{position:absolute;border:1px dashed rgba(0,0,0,.15)}
.blk2{position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;cursor:pointer;transition:left .25s,top .25s;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.exit{position:absolute;right:-16px;width:16px;background:#1b2f5a;border-radius:0 6px 6px 0}
.keyhole{position:absolute;right:-46px;font-size:26px}

.dq{background:rgba(6,24,40,.93);border:1px solid #39e0ff;border-radius:12px;padding:8px 10px;color:#eaf6ff;font-size:13px}
.dq h4{margin:0 0 6px;font-size:14px}.dq.ok{border-color:#5fd38a}.dq.bad{border-color:#ff8a7a}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ch{border:2px solid #2d6d8a;background:#0d3346;color:#fff;border-radius:10px;padding:5px 8px;cursor:pointer;font-size:13px}
.ch.sel{border-color:#7fe9ff;background:#14607f;box-shadow:0 0 8px #39e0ff}
.por{width:58px;height:58px;margin-bottom:16px;border-radius:50%;background-size:cover;background-position:50% 18%;border:3px solid #2d6d8a;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
.por.sel{border-color:#7fe9ff;box-shadow:0 0 10px #39e0ff}.por span{white-space:nowrap;background:rgba(0,0,0,.6);font-size:11px;border-radius:6px;padding:0 4px;margin-bottom:-14px}
.evc{border:1px dashed #9adfff;border-radius:8px;padding:3px 7px;font-size:12px;cursor:pointer;background:#f6f0dd;color:#3a3020}
.evc.sel{border:2px solid #39e0ff;background:#dff8ff}
.mini{position:relative;width:96px;aspect-ratio:3/4;background:url(img/house-map.jpg) center/contain no-repeat #efe6d2;border-radius:6px}
.mini div{position:absolute;cursor:pointer;border-radius:4px}.mini div.sel{background:rgba(57,224,255,.35);outline:2px solid #39e0ff}
.hintbtn{position:absolute;left:10px;top:62px;z-index:4;width:44px;height:44px;border-radius:50%;border:2px solid #ffd84d;background:rgba(6,30,48,.88);font-size:22px;cursor:pointer;box-shadow:0 0 10px rgba(255,216,77,.6)}
.tutfx{outline:4px solid #ffd84d;outline-offset:3px}
</style></head><body>
<div id="phone">
 <div id="scene"></div>
 <div id="hud"></div>
 <div id="dlg"></div><div id="board"></div><div id="toast"></div>
 <button id="back" title="ย้อนกลับ" aria-label="ย้อนกลับ">←</button>
 <button id="caseBtn">📋 สมุดคดี</button>
</div>
<script>
const S={screen:'room',hist:[],ev:{},solved:false,reward:false,slots:{},played:{},practice:false};
const PRAC=[['cross','ครอสเวิร์ด (ภาษา)'],['jig','จิ๊กซอว์ (มิติสัมพันธ์)'],['slide','เลื่อนบล็อก (ตรรกะ)']];
function practiceMenu(){say('มุมฝึกเล่น','เลือกมินิเกมที่ปลดล็อกแล้ว — โจทย์สุ่มทั่วไป ไม่เกี่ยวกับคดี',PRAC.map(([k,n])=>[S.played[k]?'▶ '+n:'🔒 '+n,()=>{if(!S.played[k]){toast('ปลดล็อกเมื่อได้เล่นในคดีแล้ว');return}S.practice=true;MG.hints=0;go(k)}]).concat([['ปิด',()=>$('dlg').style.display='none']]));$('dlg').querySelectorAll('button.opt').forEach(b=>{if(b.textContent.startsWith('🔒'))b.classList.add('locked')})}
const EV={E01:'ข้อความของน้าริน: "ขอย้ายเก็บก่อน — ริน / เก็บตามผังเดิมนะ โต๊ะยังเปียกอยู่"',E02:'โต๊ะที่เปียก (น้ำจากแจกันหก)',E03:'ลุงเมฆ: กล่องมีรูปดาว',E04:'แผนผังบ้าน: ภาพถ่ายเก็บใต้หน้าต่างห้องทำงาน',E05:'พบอัลบั้มในกล่องรูปดาว'};
const LINES={open:'หลานมาแล้วเหรอจ๊ะ ยายหาอัลบั้มรูปครอบครัวไม่เจอ ในนั้นมีรูปตาตอนหนุ่ม ๆ ด้วยนะ',ask:'เมื่อเช้ายายยังเห็นวางอยู่บนโต๊ะกลางเลย แต่บ่ายนี้น้ารินเข้ามาเก็บกวาดนะ',stuck:'รูปเก่า ๆ บ้านนี้เขาเก็บไว้ที่เดียวกันมาตลอดแหละ ลองต่อแผนที่ที่หล่นกระจายอยู่ดูสิ',win:'นี่ไงรูปตา ขอบใจนะหลาน มานั่งดูด้วยกันมา ยายจะเล่าให้ฟัง'};
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1600)}
function addEv(k){if(!S.ev[k]){S.ev[k]=1;toast('ได้หลักฐาน '+k)}}
function hs(pts,label,fn,done){return {pts,label,fn,done}}
function say(who,text,opts){const d=$('dlg');d.innerHTML='<b>'+who+':</b> “'+text+'”<div class="btns"></div>';const b=d.querySelector('.btns');(opts||[['ปิด',()=>d.style.display='none']]).forEach(([t,f])=>{const x=document.createElement('button');x.className='opt';x.textContent=t;x.onclick=f;b.appendChild(x)});d.style.display='block'}
const SLOTS=[['ผนัง',44,21,16,13],['ชั้นของที่ระลึก',57,24,28,10],['ขอบหน้าต่าง',2,40,16,8],['โต๊ะ',52,44,35,8],['เตียง',4,52,40,12],['พรมซ้าย',12,70,27,14],['พรมกลาง',40,72,27,14],['พรมขวา',68,72,26,14]];
function say2(who,lines,i){i=i||0;say(who,lines[i],i<lines.length-1?[['ต่อ',()=>say2(who,lines,i+1)]]:null)}
const SC={
 room:{title:'ห้องของฉัน (hub)',hud:()=>S.reward?'กลับถึงบ้านแล้ว — แตะช่องเพื่อวางของรางวัล':'ภารกิจ: ไปเยี่ยมบ้านย่า',img:'player-room-wide.jpg',
  extra(el){SLOTS.forEach(([n,x,y,w,hh],i)=>{const f=S.slots[i];const d=document.createElement('div');d.className='slot'+(f?' filled':'');d.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${hh}%`;d.innerHTML=f||n;
   d.onclick=()=>{if(S.reward&&!Object.values(S.slots).includes('📷 รูปตา')){S.slots[i]='📷 รูปตา';toast('วางของรางวัลแล้ว');go('room',true)}else if(S.slots[i])toast('สลับของ (ต้นแบบมีของชิ้นเดียว)');else toast('ยังไม่มีของ — ไขคดีเพื่อรับของ')};el.appendChild(d)});
   const b=document.createElement('div');b.className='slot board';b.style.cssText='left:22%;top:13%;width:20%;height:8%';b.innerHTML='🗂 คดีที่ไขแล้ว: '+(S.solved?'01 ✓':'—');el.appendChild(b)},
  hs:()=>[hs([[60,36],[88,36],[88,43],[60,43]],'🎮 มุมฝึกเล่น ('+Object.keys(S.played).length+'/3)',practiceMenu),hs([[90,18],[100,18],[100,61],[90,61]],S.solved?'ประตู → คดีถัดไป (เร็ว ๆ นี้)':'ประตู → ไปบ้านย่า',()=>S.solved?toast('คดี 02: ห้องสมุดวันวาน (ยังไม่ทำ)'):pickDiff())]},
 map:{title:'แผนผังบ้านย่า',hud:()=>'เลือกห้องที่จะไป',img:'house-map.jpg',contain:true,mw:864,mh:1152,hs:()=>[
  hs([[107,118],[760,118],[760,515],[107,515]],'ห้องนั่งเล่น (จุดเริ่ม)',()=>go('living')),
  hs([[118,530],[485,530],[485,905],[118,905]],'ห้องทำงาน',()=>go('study')),
  hs([[505,530],[748,530],[748,905],[505,905]],'ครัว (เสริม)',()=>go('kitchen'))]},
 living:{title:'ห้องนั่งเล่น — มุมกว้างจากประตู',hud:()=>'ภารกิจ: ตามหาอัลบั้มครอบครัว',img:'living-wide.jpg',hs:()=>[
  hs([[30,33],[52,33],[52,41],[30,41]],'ถาดชิ้นแผนผัง',()=>go('tray'),S.ev.E04),
  hs([[2,17],[22,18],[22,33],[2,33]],'ประตู → ครัว',()=>go('kitchen')),
  hs([[81,19],[92,21],[92,48],[81,46]],'ประตู → ห้องทำงาน',()=>go('study')),
  hs([[76,66],[92,66],[93,70],[91,75],[84,75],[76,71]],'กล่องรูปดาว (ข้างโซฟา)',()=>say('ข้อความช่วยคิด','สัญลักษณ์ตรงแล้ว แต่ตำแหน่งนี้ตรงกับผังเก็บภาพถ่ายหรือยัง?')),
  hs([[13,67],[45,64],[74,66],[73,72],[56,79],[20,78],[13,72]],'โต๊ะกลาง',()=>go('table'),S.ev.E01),
  hs([[8,38],[16,35],[23,38],[24,44],[34,48],[34,55],[30,62],[22,64],[10,62],[2,57],[2,47],[8,45]],'ลุงเมฆ',()=>go('mek'),S.ev.E03),
  hs([[57,37],[62,36],[70,38],[71,44],[73,48],[72,54],[71,60],[66,63],[48,65],[47,60],[52,54],[53,48],[56,44]],'ยายมะลิ',()=>go('grandma'))]},
 grandma:{title:'ยายมะลิ',hud:()=>'คุยกับยายมะลิ',img:'living-grandma.jpg',hs:()=>[],enter(){
  if(S.solved)return say('ยายมะลิ',LINES.win);
  say('ยายมะลิ',LINES.open,[['ถามเรื่องอัลบั้ม',()=>say('ยายมะลิ',LINES.ask)],['ปิด',()=>$('dlg').style.display='none']])}},
 mek:{title:'ลุงเมฆ',hud:()=>'คุยกับลุงเมฆ',img:'uncle-mek.jpg',hs:()=>[],enter(){addEv('E03');
  say('ลุงเมฆ','รินเอาอัลบั้มใส่กล่องที่ติดรูปดาว ลุงเห็นตอนเธอยกผ่านโต๊ะ แต่ไม่ได้มองว่าเอาไปวางที่ไหน',[['ช่วยเติมครอสเวิร์ด (เสริม)',()=>say('ลุงเมฆ','ถ้าชอบเกมคำศัพท์ มาช่วยลุงเติมหน้านี้ด้วยก็ได้นะ อีกไม่กี่คำเอง',[['เปิดครอสเวิร์ด',()=>{MG.hints=0;go('cross')}]])],['ปิด',()=>$('dlg').style.display='none']])}},
 table:{title:'โต๊ะกลาง',hud:()=>'แตะเพื่อตรวจ',img:'living-table.jpg',hs:()=>[
  hs([[18,23],[45,22],[51,33],[25,36]],'ข้อความของน้าริน',()=>{addEv('E01');say('ข้อความ','ขอย้ายเก็บก่อน — ริน / (ด้านหลัง) เก็บตามผังเดิมนะ โต๊ะยังเปียกอยู่')},S.ev.E01),
  hs([[17,42],[40,40],[59,48],[55,58],[40,62],[18,61],[19,52]],'รอยน้ำ',()=>{addEv('E02');toast('โต๊ะเปียก — น้ำหกจากแจกัน')},S.ev.E02),
  hs([[55,52],[87,55],[85,77],[53,73]],'รอยที่อัลบั้มเคยวาง',()=>toast('ตรงนี้เคยมีอัลบั้มวางอยู่'))]},
 tray:{title:'ถาดชิ้นแผนผัง',hud:()=>'ชิ้นแผนผังแม่เหล็กหล่นกระจาย',img:'living-shelf-tray.jpg',hs:()=>[
  hs([[2,50],[95,49],[100,58],[97,80],[55,82],[3,74]],'ต่อจิ๊กซอว์แผนผังบ้าน',()=>{MG.hints=0;go('jig')},S.ev.E04)]},
 jigsaw:{title:'จิ๊กซอว์แผนผังบ้าน',hud:()=>'⏱ 00:42 · สถิติดีที่สุด 00:35 · ⭐⭐⭐ ถ้าไม่ใช้คำใบ้',img:'house-map.jpg',contain:true,mw:864,mh:1152,hs:()=>[

const TUT=['ขั้น 1/3: แตะจุดกะพริบเพื่อดูหรือใช้วัตถุ','ขั้น 2/3: ปุ่ม ← มุมล่างซ้าย ใช้ย้อนกลับเสมอ','ขั้น 3/3: ปุ่ม 📋 สมุดคดี เปิดกระดานคดีและหลักฐาน'];
function tutorial(i){document.querySelectorAll('.tutfx').forEach(e=>e.classList.remove('tutfx'));if(i>=TUT.length){$('dlg').style.display='none';S.tut=1;return}
 const t=[null,'back','caseBtn'][i];if(t){$(t).classList.add('tutfx');$(t).style.visibility='visible'}say('บทสอน (HUD)',TUT[i],[[i<2?'ต่อ':'เริ่มเล่น',()=>tutorial(i+1)]])}
const HOUSE=['living','study','kitchen','table','tray','mek','grandma','kclose'];
function draw(){const sc=SC[S.screen],el=$('scene');let list;
 if(sc.render){el.innerHTML='<div class="bg" style="background:linear-gradient(160deg,#1d3346,#2c4a5e)"></div>';list=sc.render(el)}else{el.innerHTML=`<img class="bg ${sc.contain?'contain':''}" src="img/${sc.img}" alt="">`;list=sc.hs();sc.extra&&sc.extra(el)}
 if(HOUSE.includes(S.screen)){const m=document.createElement('button');m.className='mapbtn';m.textContent='🗺 แผนผังบ้าน';m.onclick=()=>go('map');el.appendChild(m)}
 const map=!!sc.contain,W=map?sc.mw:720,Hh=map?sc.mh:1280,NS='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','hl');svg.setAttribute('viewBox',`0 0 ${W} ${Hh}`);svg.setAttribute('preserveAspectRatio',map?'xMidYMid meet':'xMidYMid slice');
 const fs=map?34:30;
 list.forEach(h=>{const P=h.pts.map(([x,y])=>map?[x,y]:[x*7.2,y*12.8]);
  const cx=P.reduce((a,p)=>a+p[0],0)/P.length,cy=P.reduce((a,p)=>a+p[1],0)/P.length,top=Math.min(...P.map(p=>p[1]));
  const g=document.createElementNS(NS,'g');g.setAttribute('class','hot'+(h.done?' done':''));
  const tw=h.label.length*fs*0.56+28;let lx=Math.max(4,Math.min(W-tw-4,cx-tw/2));let ly=top-fs-22;if(ly<150)ly=Math.min(Hh-fs-30,top+8);
  g.innerHTML=`<polygon points="${P.map(p=>p.join(',')).join(' ')}"/><circle class="dot" cx="${cx}" cy="${cy}" r="${map?11:13}"/><g class="lbl"><rect x="${lx}" y="${ly}" width="${tw}" height="${fs+20}" rx="${(fs+20)/2}"/><text x="${lx+tw/2}" y="${ly+fs+2}" font-size="${fs}" text-anchor="middle">${h.label}</text></g>`;
  g.querySelector('polygon').addEventListener('click',e=>{e.stopPropagation();g.classList.add('on');setTimeout(()=>{g.classList.remove('on');h.fn()},250)});
  svg.appendChild(g)});
 el.appendChild(svg);
 $('hud').innerHTML='<b>'+sc.title+'</b><br>'+sc.hud()+' · หลักฐาน '+Object.keys(S.ev).length+'/5';
 $('back').style.visibility=S.hist.length?'visible':'hidden';
 if(!sc.render){const hb=document.createElement('button');hb.className='hintbtn';hb.title='คำใบ้';hb.textContent='💡';hb.onclick=arHint;el.appendChild(hb)}draw2()}
function go(n,replace){$('dlg').style.display='none';$('board').style.display='none';if(!replace&&n!==S.screen)S.hist.push(S.screen);if(['cross','jig','slide'].includes(n)&&!S.practice&&!S.played[n]){S.played[n]=1}
 const el=$('scene');el.classList.add('fade');setTimeout(()=>{S.screen=n;draw();el.classList.remove('fade');SC[n].enter&&SC[n].enter()},300)}
$('back').onclick=()=>{if($('dlg').style.display==='block'||$('board').style.display==='block'){$('dlg').style.display='none';$('board').style.display='none';return}const p=S.hist.pop();if(p==='room')S.practice=false;if(p){const el=$('scene');el.classList.add('fade');setTimeout(()=>{S.screen=p;draw();el.classList.remove('fade')},300)}};
$('caseBtn').onclick=()=>{const b=$('board');if(b.style.display==='block'){b.style.display='none';return}
 b.innerHTML='<h3 style="margin-top:0">📋 กระดานคดี: อัลบั้มครอบครัวที่หายไป</h3><ul>'+Object.keys(EV).map(k=>S.ev[k]?`<li>✅ <b>${k}</b> ${EV[k]}</li>`:`<li style="opacity:.45">⬜ ${k} — ยังไม่พบ</li>`).join('')+'</ul>'+(S.deduced?'<p>✅ สรุปคดีแล้ว — ไปเปิดกล่องในห้องทำงาน</p>':S.ev.E01&&S.ev.E02&&S.ev.E04?'<button class="mgbtn" id="goDed">⚖ สรุปคดี (3 คำถาม)</button>':'<p style="opacity:.7">เก็บหลักฐาน E01, E02, E04 ให้ครบเพื่อสรุปคดี</p>');b.style.display='block';const g=$('goDed');if(g)g.onclick=()=>go('deduce')};
draw();setTimeout(()=>tutorial(0),400);
</script></body></html>
